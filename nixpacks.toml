# System packages required by WeasyPrint (Pango, Cairo, fontconfig, fonts)
# Without these the PDF route either ImportErrors or produces a blank/corrupted PDF.
[phases.setup]
nixPkgs = [
  "pango",
  "cairo",
  "gdk_pixbuf",
  "gobject-introspection",
  "fontconfig",
  "freetype",
  "libffi",
  "harfbuzz",
  "glib",
  "liberation_ttf",
  "dejavu_fonts",
]
