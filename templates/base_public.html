<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}YCL Statistics{% endblock %}</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='ycl-logo.png') }}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root {
      --ycl-blue:       #1a4f9e;
      --ycl-blue-dark:  #153f80;
      --ycl-blue-light: #2563b8;
      --ycl-blue-pale:  #e8f0fb;
    }
    body { background: #f0f4f9; }

    .public-header { background: var(--ycl-blue); color: #fff; }
    .public-header .logo-wrap { background: #fff; border-radius: 6px; padding: 3px 8px; display:inline-flex; align-items:center; }
    .public-header .logo-wrap img { height: 38px; width: auto; display:block; }
    .public-header .brand-text { font-size: 1.05rem; font-weight: 700; letter-spacing: -.3px; line-height: 1.15; }

    /* ── Cards ── */
    .card { border: none; border-radius: 10px; box-shadow: 0 1px 6px rgba(0,0,0,.08);
            transition: box-shadow .15s ease; }
    .card:hover { box-shadow: 0 4px 14px rgba(0,0,0,.12); }
    .card-header-custom { background: #fff; border-bottom: 1px solid #e9ecef; padding: 1rem 1.25rem; }

    .text-primary { color: var(--ycl-blue) !important; }
    a { color: var(--ycl-blue); }
    a:hover { color: var(--ycl-blue-dark); }

    /* ── Print ── */
    @media print {
      .public-header, footer, .btn { display: none !important; }
      .container-lg { max-width: 100% !important; padding: 0 !important; }
      body { background: #fff !important; font-size: .85rem; }
      .card { box-shadow: none !important; border: 1px solid #dee2e6 !important; break-inside: avoid; }
      h1, h2, h3, h4, h5 { color: #1a4f9e !important; }
    }
  </style>
</head>
<body>

<header class="public-header py-3">
  <div class="container-lg d-flex align-items-center gap-2">
    <span class="logo-wrap"><img src="{{ url_for('static', filename='ycl-logo.png') }}" alt="YCL logo"></span>
    <span class="brand-text">York County Library<br>Public Statistics</span>
  </div>
</header>

<div class="container-lg py-4">
  {% block content %}{% endblock %}
</div>

<footer class="text-center text-muted small py-4 mt-4 border-top bg-white">
  York County Library &mdash; {{ now.year }}
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
