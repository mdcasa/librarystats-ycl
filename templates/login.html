<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In – YCL Statistics</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background: #f4f6f9; }
    .login-card { max-width: 380px; margin: 10vh auto 0; }
    .login-header { background: #fff; border-bottom: 1px solid #e3e8f0; border-radius: 10px 10px 0 0; padding: 2rem; text-align: center; }
    .card { border: none; border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,.12); }
  </style>
</head>
<body>

<div class="login-card">
  <div class="card">
    <div class="login-header">
      <img src="/static/ycl-logo.png" alt="YCL" style="height:48px;margin-bottom:.5rem">
      <h1 class="h5 fw-bold mb-0" style="color:#1a4f9e;">YCL Statistics</h1>
    </div>
    <div class="card-body p-4">
      <h2 class="h6 fw-semibold text-center text-muted mb-4">Sign in to continue</h2>

      {% if error %}
      <div class="alert alert-danger py-2 small"><i class="bi bi-exclamation-circle me-1"></i>{{ error }}</div>
      {% endif %}

      <form method="post">
        <div class="mb-3">
          <label class="form-label fw-semibold">Username</label>
          <input type="text" name="username" class="form-control" autofocus autocomplete="username" required>
        </div>
        <div class="mb-4">
          <label class="form-label fw-semibold">Password</label>
          <input type="password" name="password" class="form-control" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">
          <i class="bi bi-box-arrow-in-right me-1"></i>Sign In
        </button>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
